# Dev overlay: self-contained cluster for local testing (kind / minikube's docker
# driver — both resolve host.docker.internal via Docker Desktop). In-cluster Redis +
# Postgres are enabled (the Postgres also hosts semantic-service's database); autoscaling
# floors are lowered to fit a laptop. StarRocks + Keycloak stay external on the host, and this
# file points semantic-service's SR_JDBC_URL and config.keycloak* at it.
#
# helm upgrade --install dp ./helm/data-platform -f values-dev.yaml

observability:
  environment: "dev"
  tracingSampleRate: "1.0"     # sample everything locally
  collector:
    enabled: true              # in-cluster collector; point it at your Tempo
    tempoEndpoint: "tempo:4317"

config:
  springProfilesActive: "dev,json"
  # Reach docker-compose services on the host from inside kind (Docker Desktop
  # resolves host.docker.internal for every container, kind nodes included).
  keycloakServerUrl: "http://host.docker.internal:8080"
  keycloakIssuerUri: "http://host.docker.internal:8080/realms/data-platform"

infra:
  redis:
    enabled: true
    persistence:
      enabled: false
  postgresql:
    enabled: true
    persistence:
      enabled: false        # ephemeral for dev

services:
  semantic-service:
    autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 3 }
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits:   { cpu: 500m, memory: 768Mi }
    # The in-cluster Postgres (its user is a superuser there, which the SQL gateway's catalog
    # databases need) and a host-run StarRocks. No TLS on a laptop, so plaintext logins are allowed;
    # reach the gateway with `kubectl port-forward svc/dp-semantic-service 15432:15432`.
    env:
      DB_URL: "jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/semantic"
      DB_USER: "iam"
      SR_JDBC_URL: "jdbc:mysql://host.docker.internal:9030/information_schema?useSSL=false&allowPublicKeyRetrieval=true&tinyInt1isBit=false"
      SR_USER: "root"
      SQL_GATEWAY_PORT: "15432"
      SQL_GATEWAY_ALLOW_PLAINTEXT: "true"
    envSecret:
      DB_PASSWORD: DB_PASSWORD
      SR_PASSWORD: SR_PASSWORD
      SQL_GATEWAY_READER_PASSWORD: SQL_GATEWAY_READER_PASSWORD
  chat-service:
    autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 3 }
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits:   { cpu: 500m, memory: 768Mi }
  iam-service:
    autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 3 }
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits:   { cpu: 500m, memory: 768Mi }
  data-platform-ui:
    autoscaling: { enabled: false }
    replicas: 1

# Self-hosted Superset, pre-wired to the SQL gateway (see values.yaml's `superset:` block).
# Reach it via `kubectl port-forward svc/dp-superset 8088:8088` — ingress stays off in dev.
superset:
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits:   { cpu: 500m, memory: 1Gi }
