# Default values for the data-platform chart.
# These defaults are production-leaning: autoscaling on, in-cluster backing
# infra OFF (point at managed/external services). See values-dev.yaml for a
# self-contained local stack and values-prod.yaml for a hardened example.

global:
  # Prefixed onto every image repository, e.g. "registry.example.com/".
  imageRegistry: ""
  imagePullSecrets: []

serviceAccount:
  create: true
  # Leave empty to use "<release>-sa".
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# Release-aware, shared configuration surfaced to every service as env vars
# (via the ConfigMap). Cross-service URLs (e.g. the semantic-service address a
# chat pod calls) are derived from the release name in the template, so they
# are NOT listed here. Override the external endpoints below per environment.
# ---------------------------------------------------------------------------
config:
  # "json" activates structured JSON logging (logback-spring.xml) for Loki.
  springProfilesActive: "prod,json"
  # Redis — overridden automatically when infra.redis.enabled=true.
  redisHost: "redis"
  redisPort: "6379"
  chatMemory: "redis"
  # iam-service datasource — overridden when infra.postgresql.enabled=true.
  iamDbUrl: "jdbc:postgresql://iam-postgres:5432/iam"
  # Keycloak — external by default.
  keycloakServerUrl: "http://keycloak:8080"
  keycloakIssuerUri: "http://keycloak:8080/realms/data-platform"
  keycloakRealm: "data-platform"

# Secret consumed by the backend services (database and StarRocks passwords, the SQL
# gateway's catalog reader password, Keycloak admin secret). In prod set create=false and pre-provision a Secret
# named `name` out of band (sealed-secrets / external-secrets / vault).
appSecret:
  create: true
  name: ""            # empty -> "<release>-secret"
  data:
    DB_PASSWORD: "iam"
    SEMANTIC_DB_PASSWORD: "semantic-db-change-me"
    SR_PASSWORD: ""
    SQL_GATEWAY_READER_PASSWORD: "semantic-bi-reader-change-me"
    # A SQL gateway account's key for Superset's connection; empty until an admin creates the
    # account after the first model publish (helm/README.md "BI tool connections").
    SUPERSET_SEMANTIC_SQL_PASSWORD: ""
    KEYCLOAK_ADMIN_CLIENT_SECRET: "iam-service-secret"
    # Shared by iam-service and every authz-client for the /internal subject lookup (X-Internal-Token).
    IAM_INTERNAL_TOKEN: "iam-internal-token-change-me"
    SUPERSET_SECRET_KEY: "superset-secret-change-me-please-32bytes-min"
    SUPERSET_ADMIN_PASSWORD: "superset-admin-change-me"
    # Only read when infra.postgresql.enabled=false (superset.metadataDbUrl points external).
    SUPERSET_DB_PASSWORD: "superset-db-change-me"

# ---------------------------------------------------------------------------
# Stateless application services. Structurally identical, rendered by a range
# in templates/deployment.yaml / service.yaml / hpa.yaml / pdb.yaml.
# ---------------------------------------------------------------------------
services:
  semantic-service:
    enabled: true
    image:
      repository: data-platform/semantic-service
      tag: ""                    # empty -> Chart.appVersion
      pullPolicy: IfNotPresent
    port: 8081
    replicas: 2                  # used only when autoscaling.enabled=false
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits:   { cpu: "1",  memory: 1Gi }
    probes:
      type: http                 # actuator present
      path: /actuator/health
      initialDelaySeconds: 30
    metrics:
      enabled: true
      path: /actuator/prometheus
    pdb:
      enabled: true
      minAvailable: 1
    # The SQL gateway for BI tools (Postgres wire protocol).
    extraPorts:
      - name: pgwire
        port: 15432
    # Its own database and StarRocks; env values go through `tpl`, so they may use
    # {{ .Release.Name }}. These win over the shared ConfigMap's DB_URL, which is iam-service's.
    env:
      DB_URL: "jdbc:postgresql://semantic-db:5432/semantic"
      DB_USER: "semantic"
      SR_JDBC_URL: "jdbc:mysql://starrocks:9030/information_schema?useSSL=false&allowPublicKeyRetrieval=true&tinyInt1isBit=false"
      SR_USER: "semantic_reader"
      SQL_GATEWAY_PORT: "15432"
    envSecret:
      DB_PASSWORD: SEMANTIC_DB_PASSWORD
      SR_PASSWORD: SR_PASSWORD
      SQL_GATEWAY_READER_PASSWORD: SQL_GATEWAY_READER_PASSWORD
    sqlGateway:
      # Secret with `keystore.p12` and `password`; once set every gateway login must use TLS.
      tlsSecret: ""
    # Exposes only the SQL gateway port outside the cluster for BI tools (Power BI Desktop, an
    # external Superset/Tableau, Supabase). Off by default: a credentialed Postgres-wire endpoint,
    # opt in per environment, and only together with sqlGateway.tlsSecret.
    sqlExternal:
      enabled: false
      type: LoadBalancer          # LoadBalancer | NodePort
      annotations: {}
      loadBalancerSourceRanges: []
      nodePort: null               # only used when type: NodePort

  chat-service:
    enabled: true
    image:
      repository: data-platform/chat-service
      tag: ""
      pullPolicy: IfNotPresent
    port: 8082
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8             # chat is the hottest path
      targetCPUUtilizationPercentage: 65
      targetMemoryUtilizationPercentage: 80
    resources:
      requests: { cpu: 300m, memory: 512Mi }
      limits:   { cpu: "1",  memory: 1Gi }
    probes:
      type: http                 # actuator added for observability
      path: /actuator/health
      initialDelaySeconds: 30
    metrics:
      enabled: true
      path: /actuator/prometheus
    pdb:
      enabled: true
      minAvailable: 1
    env: {}

  iam-service:
    enabled: true
    image:
      repository: data-platform/iam-service
      tag: ""
      pullPolicy: IfNotPresent
    port: 8084
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits:   { cpu: "1",  memory: 1Gi }
    probes:
      type: http                 # actuator health probes enabled in app config
      livenessPath: /actuator/health/liveness
      readinessPath: /actuator/health/readiness
      initialDelaySeconds: 30
    metrics:
      enabled: true
      path: /actuator/prometheus
    pdb:
      enabled: true
      minAvailable: 1
    env: {}

  data-platform-ui:
    enabled: true
    image:
      repository: data-platform/data-platform-ui
      tag: ""
      pullPolicy: IfNotPresent
    port: 8080                   # unprivileged nginx
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 80
    resources:
      requests: { cpu: 50m,  memory: 64Mi }
      limits:   { cpu: 250m, memory: 128Mi }
    probes:
      type: http
      path: /healthz
      initialDelaySeconds: 5
    pdb:
      enabled: true
      minAvailable: 1
    env: {}

# ---------------------------------------------------------------------------
# Apache Superset — self-hosted BI tool, pre-wired to semantic-service's SQL gateway as a
# Postgres data source (cubes and views appear as tables). Not part of the
# `services:` range above because it needs its own metadata database + first-boot admin/init
# steps that don't fit that generic template. OFF by default; see values-dev.yaml /
# values-staging.yaml for enabled examples. Power BI Desktop (a client app, nothing to deploy)
# connects the same way — see helm/README.md "BI tool connections".
#
# The stock apache/superset image ships with NO Postgres driver (confirmed empirically: `import
# psycopg2` fails) — templates/superset-deployment.yaml installs psycopg2-binary into a shared
# emptyDir at pod startup so both the metadata-DB connection and the gateway connection work
# unmodified. Costs ~10-20s of extra startup latency pulling from PyPI; swap in a custom image
# with the driver baked in (`FROM apache/superset:3.1.3` + `pip install psycopg2-binary`) for
# production if that latency/PyPI dependency at boot isn't acceptable.
# ---------------------------------------------------------------------------
superset:
  enabled: false
  image:
    repository: apache/superset
    tag: "3.1.3"
    pullPolicy: IfNotPresent
  port: 8088
  replicas: 1                   # single instance: simplest way to avoid concurrent first-boot
                                 # admin-creation/db-upgrade races; scale up once that's handled.
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 2Gi }
  probes:
    initialDelaySeconds: 30
  admin:
    username: admin
    firstName: Superset
    lastName: Admin
    email: admin@example.com
    # password: appSecret.data.SUPERSET_ADMIN_PASSWORD
  # Superset's own metadata store (dashboards, users, saved connections — NOT your data).
  # In-cluster: reuses infra.postgresql's instance, a second "superset" database alongside
  # iam-service's, dev-only (same pattern as config.iamDbUrl). Set infra.postgresql.enabled:
  # false and metadataDbUrl below for a managed Postgres in prod/staging.
  metadataDb:
    database: superset
  # Full SQLAlchemy URI for an EXTERNAL metadata Postgres. Embed the literal placeholder
  # "$(SUPERSET_DB_PASS)" where the password goes — Kubernetes expands it from appSecret's
  # SUPERSET_DB_PASSWORD key at container start. Only used when infra.postgresql.enabled=false.
  metadataDbUrl: "postgresql+psycopg2://superset:$(SUPERSET_DB_PASS)@superset-db.internal:5432/superset"
  semantic:
    # Registers the SQL gateway as a Superset database connection on start (`superset
    # set-database-uri`), once appSecret's SUPERSET_SEMANTIC_SQL_PASSWORD holds the key of the
    # gateway account below. Set false to add the connection by hand (Data > Databases).
    registerConnection: true
    connectionName: "Semantic layer"
    username: "acme/superset"
  ingress:
    enabled: false
    host: superset.data-platform.local
    annotations: {}
    tls: []

# ---------------------------------------------------------------------------
# Ingress. Single host; the UI at "/" and each backend under an /api/* prefix
# that is stripped before forwarding (nginx-ingress rewrite). Build the UI with
# VITE_SEMANTIC_API=/api/semantic etc. so the browser calls match these paths.
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: data-platform.local
  # Extra annotations added to BOTH ingresses (e.g. cert-manager, auth). The
  # prefix-stripping rewrite is applied automatically to the API ingress only.
  annotations: {}
  tls: []                        # e.g. [{ secretName: dp-tls, hosts: [data-platform.local] }]
  # path -> service. `ui` catches everything else at "/".
  apiRoutes:
    - pathPrefix: /api/semantic
      service: semantic-service
    - pathPrefix: /api/chat
      service: chat-service
    - pathPrefix: /api/iam
      service: iam-service

# ---------------------------------------------------------------------------
# Optional in-cluster backing infra — DEV CONVENIENCE ONLY, not production
# grade. Best practice: keep these OFF in prod and use managed Postgres,
# managed Redis, and a Keycloak operator / managed IdP. StarRocks is
# intentionally NOT bundled — run it with a dedicated operator (or a host
# docker-compose in dev) and point semantic-service's SR_JDBC_URL at it.
# ---------------------------------------------------------------------------
infra:
  redis:
    enabled: false
    image: redis:7-alpine
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 250m, memory: 256Mi }
    persistence:
      enabled: false
      size: 1Gi
  postgresql:
    enabled: false
    image: postgres:16-alpine
    database: iam
    username: iam
    # password is taken from appSecret.data.DB_PASSWORD
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 512Mi }
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""

# ---------------------------------------------------------------------------
# Observability. Every service exposes Prometheus metrics and exports OTLP
# traces; logs go to stdout as JSON (traceId/spanId) for a Loki agent.
#   - prometheusAnnotations: annotate pods for a scrape-annotation Prometheus.
#   - serviceMonitor:        emit ServiceMonitors for the Prometheus Operator
#                            (kube-prometheus-stack) instead — pick one.
#   - collector:             deploy a small in-cluster OTel Collector. When on,
#                            OTLP_TRACING_ENDPOINT auto-points at it; otherwise
#                            set observability.otlpEndpoint to an external one.
# The Grafana/Tempo/Loki/Prometheus backends themselves are expected from
# kube-prometheus-stack + Grafana Tempo/Loki (or Grafana Cloud) — see README.
# ---------------------------------------------------------------------------
observability:
  enabled: true
  tracingSampleRate: "0.1"
  environment: "prod"
  # Used when collector.enabled=false. Full OTLP HTTP traces URL.
  otlpEndpoint: "http://otel-collector:4318/v1/traces"
  prometheusAnnotations:
    enabled: true
  serviceMonitor:
    enabled: false
    # Extra labels so the Prometheus Operator selects these (e.g. release: kube-prometheus-stack).
    labels: {}
    interval: 15s
  collector:
    enabled: false
    image: otel/opentelemetry-collector-contrib:0.119.0
    # Where the collector forwards traces (e.g. an in-cluster Tempo).
    tempoEndpoint: "tempo:4317"
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 512Mi }

# ---------------------------------------------------------------------------
# API gateway. provider=kong fronts all services with Kong (via the Kong
# Ingress Controller): JWT authentication at the edge, then the token's sub is
# forwarded as X-Idp-Sub; each service's authz-client checks permissions with iam-service.
# provider=nginx falls back to the plain nginx Ingress defined in ingress.yaml.
#
# Requires the Kong Ingress Controller installed separately (Helm: kong/ingress),
# with the serverless-function sandbox allowed to require the Lua module it uses:
#   proxy env:  untrusted_lua=sandbox
#               untrusted_lua_sandbox_requires=cjson.safe
# ---------------------------------------------------------------------------
gateway:
  provider: kong               # kong | nginx
  ingressClass: kong
  host: data-platform.local
  tls: []
  # Every service is reachable as /svc/<prefix>/<native path> (the prefix is stripped). Native
  # paths are routed too, but only those exactly one service serves: /api/v1/tables, /runs, /jobs
  # and /datasources exist in two services each, so they are prefixed-only. Unclaimed /api paths
  # get a 404. Routes of services this chart does not deploy are skipped.
  routes:
    - service: iam-service
      prefix: iam
      paths: [/api/v1/auth, /api/v1/me, /api/v1/permissions, /api/v1/roles, /api/v1/tenants, /api/v1/users]
    - service: semantic-service
      prefix: semantic
      paths: [/api/cubes, /api/model, /api/metrics, /api/glossary, /api/certifications, /api/semantic]
    - service: chat-service
      prefix: chat
      paths: [/api/chat, /api/sql]
    - service: query-service
      prefix: query
      paths: [/api/v1/queries, /api/v1/results, /api/v1/saved-queries]
    - service: catalog-service
      prefix: catalog
      paths: [/api/v1/datasets, /api/v1/files, /api/v1/lineage, /api/v1/policies, /api/v1/policy,
              /api/v1/starrocks, /api/v1/tags, /api/v1/workspaces, /api/v1/namespaces]
    - service: ingestion-service
      prefix: ingestion
      paths: [/api/v1/lakehouse, /api/v1/source, /api/v1/target, /api/v1/cdc, /api/v1/flink,
              /api/v1/seatunnel, /api/v1/schema-drift, /api/v1/metrics]
    - service: stats-service
      prefix: stats
      paths: [/api/v1/categories, /api/v1/orders, /api/v1/products, /api/v1/throughput]
    - service: search-service
      prefix: search
      paths: [/api/v1/search]
    - service: audit-service
      prefix: audit
      paths: [/api/v1/audit-events]
    - service: policy-service
      prefix: policy
      paths: []                  # its native paths are catalog-service's (policy was merged there)
  jwt:
    enabled: true
    # PEM public key of the Keycloak realm (RS256). Fetch the body from
    # GET {keycloak}/realms/{realm} .public_key and wrap in PEM headers.
    # When empty the jwt plugin is not rendered, and the subject hand-off rejects every API call (401).
    rsaPublicKey: ""
  cors:
    origins: ["*"]

# Who may reach iam-service: only this release's pods and the gateway. Its /internal subject
# lookup is not routed by the gateway and is additionally guarded by IAM_INTERNAL_TOKEN.
networkPolicy:
  iam:
    enabled: false
    # Namespace of the Kong proxy (kubernetes.io/metadata.name), so routed /api/v1 calls still arrive.
    gatewayNamespace: kong
    # Extra peers, e.g. the Prometheus namespace when scraping iam-service:
    #   - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
    extraFrom: []
