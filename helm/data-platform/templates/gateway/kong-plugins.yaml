{{- if eq .Values.gateway.provider "kong" }}
{{- $rel := .Release.Name -}}
{{- /* Authorization hand-off: forward the verified token's sub as X-Idp-Sub; each
       service's authz-client checks permissions with iam-service. Mirrors gateway/authz.lua.
       Needs the jwt plugin (gateway.jwt), otherwise every request is rejected with 401. */ -}}
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ $rel }}-iam-authz
  labels:
    {{- include "dp.commonLabels" . | nindent 4 }}
plugin: post-function
config:
  access:
    - |
      local cjson = require "cjson.safe"

      -- 1. Strip spoofable identity headers before anything downstream can see them.
      local IDENTITY = { "X-Idp-Sub", "X-Tenant-Id", "X-User-Id", "X-Roles", "X-Permissions" }
      for _, h in ipairs(IDENTITY) do
        kong.service.request.clear_header(h)
      end

      -- 2. The jwt plugin leaves the verified token here; without it there is no authenticated caller.
      local token = kong.ctx.shared.authenticated_jwt_token
      if not token then
        return kong.response.exit(401, { message = "missing or invalid bearer token" })
      end

      -- 3. Read `sub` from the (already verified) payload; JWTs use unpadded base64url.
      local function b64url_decode(s)
        s = s:gsub("-", "+"):gsub("_", "/")
        return ngx.decode_base64(s .. string.rep("=", (4 - #s % 4) % 4))
      end
      local payload = token:match("^[^.]+%.([^.]+)%.")
      local json = payload and b64url_decode(payload)
      local claims = json and cjson.decode(json)
      if not claims or type(claims.sub) ~= "string" or claims.sub == "" then
        return kong.response.exit(401, { message = "token has no subject" })
      end

      kong.service.request.set_header("X-Idp-Sub", claims.sub)
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ $rel }}-api-unrouted
  labels:
    {{- include "dp.commonLabels" . | nindent 4 }}
plugin: request-termination
config:
  status_code: 404
  message: "No single service owns this path; call it as /svc/<service>/<path>"
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ $rel }}-cors
  labels:
    {{- include "dp.commonLabels" . | nindent 4 }}
plugin: cors
config:
  origins:
    {{- toYaml .Values.gateway.cors.origins | nindent 4 }}
  methods: [GET, POST, PUT, DELETE, OPTIONS, PATCH]
  headers: [Authorization, Content-Type, Accept, X-Correlation-Id]
  credentials: false
  preflight_continue: false
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ $rel }}-correlation-id
  labels:
    {{- include "dp.commonLabels" . | nindent 4 }}
plugin: correlation-id
config:
  header_name: X-Correlation-Id
  generator: uuid
  echo_downstream: true
{{- if and .Values.gateway.jwt.enabled .Values.gateway.jwt.rsaPublicKey }}
---
{{- /* Authentication: validate Keycloak-issued RS256 JWTs at the edge. */ -}}
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ $rel }}-jwt-auth
  labels:
    {{- include "dp.commonLabels" . | nindent 4 }}
plugin: jwt
config:
  claims_to_verify: [exp]
  key_claim_name: iss
---
apiVersion: configuration.konghq.com/v1
kind: KongConsumer
metadata:
  name: {{ $rel }}-keycloak
  annotations:
    kubernetes.io/ingress.class: {{ .Values.gateway.ingressClass }}
  labels:
    {{- include "dp.commonLabels" . | nindent 4 }}
username: keycloak
credentials:
  - {{ $rel }}-keycloak-jwt
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $rel }}-keycloak-jwt
  labels:
    konghq.com/credential: jwt
    {{- include "dp.commonLabels" . | nindent 4 }}
stringData:
  key: {{ .Values.config.keycloakIssuerUri | quote }}
  algorithm: RS256
  rsa_public_key: |-
{{ .Values.gateway.jwt.rsaPublicKey | indent 4 }}
{{- end }}
{{- end }}
