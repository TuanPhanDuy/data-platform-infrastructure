{{- $iam := index .Values.services "iam-service" -}}
{{- if and .Values.networkPolicy.iam.enabled $iam $iam.enabled }}
{{- /* Only this release's pods and the gateway may reach iam-service; see values networkPolicy.iam. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dp.resourceName" (dict "root" . "name" "iam-service") }}-ingress
  labels:
    {{- include "dp.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dp.selectorLabels" (dict "root" . "name" "iam-service") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.iam.gatewayNamespace }}
        {{- with .Values.networkPolicy.iam.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
